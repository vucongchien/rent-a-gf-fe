name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
      - feature/docker-setup
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        # Sử dụng GitHub action chính thức để đăng nhập vào ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # secrets.GITHUB_TOKEN được GitHub sinh tự động, có quyền write package nhờ khai báo permissions ở trên
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        # GHCR yêu cầu tên image viết thường hoàn toàn, step này đổi tên repo sang chữ thường
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./my-app
          file: ./my-app/Dockerfile
          # Chỉ thực hiện push lên registry khi push code trực tiếp, PR chỉ test build xem có lỗi không
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Sử dụng GitHub Actions Cache để tối ưu hóa tốc độ build các layer Docker
          cache-from: type=gha
          cache-to: type=gha,mode=max
